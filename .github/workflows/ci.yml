name: Synthetic unit checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run synthetic unit tests (no model calls or downloads)
        run: node --test 'tests/*.test.mjs'
      - name: Check patch whitespace
        run: git diff --check
